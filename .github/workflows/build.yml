# ============ FloatingURL CI：编译 deb + 发布到 yzdmm2024/repo 源 ============
# 出包方式照搬已验证的 PowerSave：brew 装 theos 依赖 + gh 拉 14.5 SDK +
# make 编译 + 手动 dpkg-deb stage 到 var/jb/...（rootless / roothide 注入目录）
# 发布：把 deb 推到 yzdmm2024/repo 的 debs/，其 gen.yml 会自动重建 Packages

name: Build 悬浮URL FloatingURL

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-14
    env:
      HOMEBREW_NO_REQUIRE_TAP_TRUST: "1"
    steps:
      - uses: actions/checkout@v4

      - name: Install Theos dependencies
        run: |
          brew install ldid dpkg xz perl || true

      - name: Install Theos + 14.5 SDK
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git clone --depth=1 https://github.com/theos/theos.git $HOME/theos
          export THEOS=$HOME/theos
          $THEOS/bin/update-theos
          mkdir -p $HOME/theos/sdks
          gh release download -R theos/sdks -p "iPhoneOS14.5.sdk.tar.xz" -D /tmp
          tar -xJf /tmp/iPhoneOS14.5.sdk.tar.xz -C $HOME/theos/sdks/
          ln -sf "$HOME/theos/sdks/iPhoneOS14.5.sdk" "$HOME/theos/sdks/iPhoneOS14.0.sdk"

      - name: Build with Theos (compile only)
        run: |
          export THEOS=$HOME/theos
          rm -rf .theos
          make
          echo "=== build output ==="
          find .theos -type f 2>/dev/null | head -80

      - name: Package deb manual (TweakInject stage)
        run: |
          set -e
          PKG=$(grep '^Package:' control | awk '{print $2}')
          VERSION=$(grep '^Version:' control | awk '{print $2}')
          ARCH=$(grep '^Architecture:' control | awk '{print $2}')
          echo "PKG=$PKG VERSION=$VERSION ARCH=$ARCH"
          mkdir -p stage/DEBIAN

          # ---- TweakInject：dylib + 对应的 Filter plist（roothide 真正扫描的注入目录）----
          mkdir -p stage/var/jb/usr/lib/TweakInject
          cp .theos/obj/debug/FloatingURL.dylib stage/var/jb/usr/lib/TweakInject/ 2>/dev/null || \
          cp .theos/obj/FloatingURL.dylib stage/var/jb/usr/lib/TweakInject/ || { echo "FATAL: FloatingURL.dylib not found"; exit 1; }
          cp FloatingURL.plist stage/var/jb/usr/lib/TweakInject/

          # ---- PreferenceBundles：先铺 layout（手写 Info/Root.plist），再单独拷 theos 产出的可执行文件 ----
          mkdir -p stage/var/jb/Library/PreferenceBundles
          cp -R layout/Library/PreferenceBundles/FloatingURLPrefs.bundle stage/var/jb/Library/PreferenceBundles/
          cp .theos/obj/debug/FloatingURLPrefs.bundle/FloatingURLPrefs stage/var/jb/Library/PreferenceBundles/FloatingURLPrefs.bundle/ 2>/dev/null || \
          cp .theos/obj/FloatingURLPrefs.bundle/FloatingURLPrefs stage/var/jb/Library/PreferenceBundles/FloatingURLPrefs.bundle/ || { echo "FATAL: FloatingURLPrefs executable not found"; exit 1; }

          # ---- PreferenceLoader 入口 ----
          mkdir -p stage/var/jb/Library/PreferenceLoader/Preferences
          cp layout/Library/PreferenceLoader/Preferences/FloatingURLEntry.plist stage/var/jb/Library/PreferenceLoader/Preferences/

          # ---- 自检 ----
          test -f stage/var/jb/Library/PreferenceBundles/FloatingURLPrefs.bundle/FloatingURLPrefs || { echo "FATAL: prefs executable missing"; exit 1; }
          test -f stage/var/jb/Library/PreferenceBundles/FloatingURLPrefs.bundle/Root.plist || { echo "FATAL: Root.plist missing"; exit 1; }
          plutil -extract NSPrincipalClass raw stage/var/jb/Library/PreferenceBundles/FloatingURLPrefs.bundle/Info.plist

          # ---- 假签名兜底 ----
          find stage -type f \( -name "*.dylib" -o -name "FloatingURLPrefs" \) -exec ldid -S {} \;

          # ---- DEBIAN：control + preinst + postinst(respring) ----
          cp control stage/DEBIAN/control
          sed -i '' "s/^Version:.*/Version: $VERSION/" stage/DEBIAN/control
          cp layout/DEBIAN/preinst stage/DEBIAN/preinst
          cp layout/DEBIAN/postinst stage/DEBIAN/postinst
          chmod 755 stage/DEBIAN/preinst stage/DEBIAN/postinst

          echo "=== stage layout ==="
          find stage -type f

          mkdir -p packages
          dpkg-deb --root-owner-group -b stage packages/${PKG}_${VERSION}_${ARCH}.deb
          echo "=== deb ==="
          ls -la packages/

      - name: Upload deb artifact
        uses: actions/upload-artifact@v4
        with:
          name: 悬浮URL FloatingURL
          path: packages/*.deb

  publish:
    needs: build
    runs-on: ubuntu-latest
    env:
      GH_PAT: ${{ secrets.GH_PAT }}
    steps:
      - name: Download deb
        uses: actions/download-artifact@v4
        with:
          name: 悬浮URL FloatingURL
          path: deb-artifacts

      - name: Push deb to yzdmm2024/repo (apt source)
        run: |
          set -e
          git config --global user.email "ci@users.noreply.github.com"
          git config --global user.name "ci-bot"
          git clone --depth=1 https://x-access-token:${GH_PAT}@github.com/yzdmm2024/repo.git repo_src
          DEB=$(ls deb-artifacts/*.deb | head -1)
          echo "publishing $DEB"
          cp "$DEB" repo_src/debs/
          cd repo_src
          git add "debs/$(basename "$DEB")"
          git commit -m "add $(basename "$DEB")"
          git pull --rebase origin main || true
          git push
